name: Copiar datos publicados (para diseño)
# Copia a la rama «copia-datos» los archivos públicos de Barcelona y miniaturas de sus fotos de Wikimedia Commons (con su licencia).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/copiar-datos.yml', 'herramientas/copiar_datos.py', 'herramientas/diseno/**']
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 herramientas/copiar_datos.py
        env:
          SOLO_DATOS: '1'
      - name: Mapas para el diseño (OpenFreeMap, datos © OpenStreetMap)
        continue-on-error: true
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null
          python3 herramientas/diseno/capturar.py
      - name: Guardar
        run: |
          cd copia && git init -q && git checkout -q -b copia-datos
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Copia de datos publicados" && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" copia-datos:copia-datos-2

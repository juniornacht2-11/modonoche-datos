name: Auditar la web publicada
# Solo lectura: abre cada pantalla de la web real en móvil y escritorio, hace capturas y revisa errores y accesibilidad.
# No envía formularios ni cambia nada. Resultado en la rama «auditoria-web».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['herramientas/auditar_web.py', '.github/workflows/auditar-web.yml']
permissions:
  contents: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador y axe-core
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium >/dev/null
          mkdir -p /tmp/axe && cd /tmp/axe && npm init -y >/dev/null && npm install axe-core@4.10.2 >/dev/null
      - name: Auditar
        continue-on-error: true
        env:
          AXE: /tmp/axe/node_modules/axe-core/axe.min.js
        run: python3 herramientas/auditar_web.py
      - name: Guardar en la rama «auditoria-web»
        run: |
          mkdir -p auditoria && cd auditoria && git init -q && git checkout -q -b auditoria-web
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Auditoría de la web publicada" && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" auditoria-web:auditoria-web

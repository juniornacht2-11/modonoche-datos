name: Revisar la web publicada
# Abre la web real con un navegador (Chromium), hace capturas de las pantallas principales y las guarda en la rama «revision-web».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['herramientas/revisar_web.py', '.github/workflows/revisar-web.yml']
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Revisar
        continue-on-error: true
        run: python3 herramientas/revisar_web.py
      - name: Lighthouse (rendimiento, SEO y accesibilidad, en móvil)
        continue-on-error: true
        run: |
          npm install -g lighthouse@12.2.1 >/dev/null 2>&1
          export CHROME_PATH=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()")
          mkdir -p revision
          for u in "https://modonoche.juniornacht2.workers.dev/|portada" "https://modonoche.juniornacht2.workers.dev/ocio-nocturno/barcelona-08019.html|barcelona" "https://modonoche.juniornacht2.workers.dev/para-locales.html|para-locales"; do
            url="${u%%|*}"; n="${u##*|}"
            lighthouse "$url" --quiet --chrome-flags="--headless=new --no-sandbox" --output json --output-path "revision/lh-$n.json" --only-categories=performance,seo,accessibility,best-practices || true
            python3 -c "import json,sys; d=json.load(open('revision/lh-$n.json')); a=d['audits']; print('$n', {k:round(v['score']*100) for k,v in d['categories'].items() if v['score'] is not None}, {m:a[m]['displayValue'] for m in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','total-byte-weight'] if m in a}); json.dump({'cat':{k:v['score'] for k,v in d['categories'].items()},'m':{m:a[m].get('displayValue') for m in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','total-byte-weight','speed-index']},'fallos':[(k,v.get('title'),v.get('displayValue')) for k,v in a.items() if v.get('score') is not None and v['score']<0.9 and v.get('scoreDisplayMode') in ('binary','numeric','metricSavings')]}, open('revision/lh-$n-resumen.json','w'), ensure_ascii=False, indent=1)" || true
            rm -f "revision/lh-$n.json"
          done
      - name: Guardar en la rama «revision-web»
        run: |
          mkdir -p revision && cd revision && git init -q && git checkout -q -b revision-web
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Revisión de la web publicada" && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" revision-web
